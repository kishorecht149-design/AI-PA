<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arch-grad" x1="15" y1="80" x2="85" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="10" y1="50" x2="90" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <linearGradient id="inner-grad" x1="35" y1="40" x2="65" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbital Ring Back Segment -->
  <path d="M 52 32 C 72 26, 92 32, 88 44 C 84 55, 68 62, 52 64" stroke="url(#ring-grad)" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />

  <!-- Main Arch "A" -->
  <path d="M 27 75 L 43 28 C 45 22, 55 22, 57 28 L 73 75 C 75 79, 70 82, 66 79 L 55 46 C 53 40, 47 40, 45 46 L 34 79 C 30 82, 25 79, 27 75 Z" fill="url(#arch-grad)" filter="url(#glow)" />

  <!-- Assistant Head -->
  <circle cx="50" cy="44" r="5.5" fill="url(#inner-grad)" stroke="#e0f2fe" stroke-width="1.2" />

  <!-- Assistant Shoulders -->
  <path d="M 37 68 C 43 56, 57 56, 63 68 C 58 63, 42 63, 37 68 Z" fill="url(#inner-grad)" stroke="#7dd3fc" stroke-width="0.8" />

  <!-- Orbital Ring Front Segment -->
  <path d="M 12 56 C 14 44, 30 36, 48 34" stroke="#00e5ff" stroke-width="3.6" stroke-linecap="round" />
  <path d="M 12 56 C 14 62, 26 66, 42 66" stroke="url(#ring-grad)" stroke-width="3.2" stroke-linecap="round" />
</svg>
